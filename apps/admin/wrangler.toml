name = "prophetica-admin-poc"
main = ".open-next/worker.js"
compatibility_date = "2026-05-08"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "prophetica-admin-poc"

# Admin and web must share this namespace so published FAQ content is live.
[[kv_namespaces]]
binding = "FAQ_CONTENT_KV"
id = "prophetica_faq_content"

# SPEC-005 §5: KYC evidence is archived to private R2 buckets.
[[r2_buckets]]
binding = "KYC_DOCUMENTS_BUCKET"
bucket_name = "prophetica-kyc-documents"

[[r2_buckets]]
binding = "KYC_LIVENESS_BUCKET"
bucket_name = "prophetica-kyc-liveness"
