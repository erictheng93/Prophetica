syntax = "proto3";

package proph.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/erictheng93/prophetica/packages/proto/gen/go/v1;protov1";

message Money {
  int64 amount = 1;
  string currency = 2;
}

message MarketID {
  string value = 1;
}

message UserID {
  uint64 value = 1;
}

message OrderID {
  bytes value = 1;
}

message TradeID {
  uint64 value = 1;
}

message PositionID {
  string value = 1;
}

message TxnID {
  uint64 value = 1;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_YES = 1;
  OUTCOME_NO = 2;
  OUTCOME_VOID = 3;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BID = 1;
  SIDE_ASK = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_IOC = 3;
  ORDER_TYPE_FOK = 4;
  ORDER_TYPE_POST_ONLY = 5;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_DAY = 2;
  TIME_IN_FORCE_IOC = 3;
  TIME_IN_FORCE_FOK = 4;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_ACTIVE = 2;
  ORDER_STATUS_PARTIAL = 3;
  ORDER_STATUS_FILLED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

enum MarketStatus {
  MARKET_STATUS_UNSPECIFIED = 0;
  MARKET_STATUS_DRAFT = 1;
  MARKET_STATUS_REVIEW = 2;
  MARKET_STATUS_REJECTED = 3;
  MARKET_STATUS_SCHEDULED = 4;
  MARKET_STATUS_OPEN = 5;
  MARKET_STATUS_CLOSED = 6;
  MARKET_STATUS_PENDING = 7;
  MARKET_STATUS_DISPUTED = 8;
  MARKET_STATUS_SETTLING = 9;
  MARKET_STATUS_SETTLED = 10;
  MARKET_STATUS_CANCELLED = 11;
}

message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}

message AuditMeta {
  string idempotency_key = 1;
  string correlation_id = 2;
  string trace_id = 3;
  google.protobuf.Timestamp client_ts = 4;
}
