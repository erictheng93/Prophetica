// common.proto — 跨服務共用基礎型別
//
// 對應 SPEC：SPEC-002 §3.2 整數化精度、SPEC-014 §6 通訊協議。

syntax = "proto3";

package proph.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/erictheng93/prophetica/packages/proto/gen/go/v1;protov1";

// Money 代表所有金額之統一表示。
//
// 強制規則（SPEC-002 §3.2）：
//   - amount 為**內部單位**整數：對 PTS 等於「點 × 100」，對法幣等於「主單位 × 100」
//   - 永遠不使用 float / double / string
//   - currency 採 ISO 4217 + 平台保留：
//       "PTS" = 站內點數
//       "TWD" / "USD" / "JPY" / "VND" / ... = 法幣
message Money {
  int64 amount = 1;
  string currency = 2;
}

// MarketID / OrderID / UserID 等強型別 wrapper，避免欄位互換錯誤。
// （Go 在解出 stub 後可加 type alias 強化。）
message MarketID { string value = 1; }
message UserID { uint64 value = 1; }
message OrderID { uint64 value = 1; }
message TradeID { uint64 value = 1; }
message PositionID { string value = 1; }   // ULID-like
message TxnID { uint64 value = 1; }

// Outcome 結果腿（SPEC-003 §3.2）。
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_YES = 1;
  OUTCOME_NO = 2;
  OUTCOME_VOID = 3;   // 結算用：市場無效
}

// Side 為撮合引擎內部側別（SPEC-003 §4.3）。
// API 邊界給玩家用 buy/sell，引擎內部統一為 Bid/Ask。
enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BID = 1;   // 買 YES
  SIDE_ASK = 2;   // 賣 YES（= 買 NO）
}

// OrderType / TimeInForce（SPEC-003 §4.1）。
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_IOC = 3;
  ORDER_TYPE_FOK = 4;
  ORDER_TYPE_POST_ONLY = 5;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_DAY = 2;
  TIME_IN_FORCE_IOC = 3;
  TIME_IN_FORCE_FOK = 4;
}

// OrderStatus（SPEC-003 §4.2）。
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_ACTIVE = 2;
  ORDER_STATUS_PARTIAL = 3;
  ORDER_STATUS_FILLED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

// MarketStatus（SPEC-015 §3）。
enum MarketStatus {
  MARKET_STATUS_UNSPECIFIED = 0;
  MARKET_STATUS_DRAFT = 1;
  MARKET_STATUS_REVIEW = 2;
  MARKET_STATUS_REJECTED = 3;
  MARKET_STATUS_SCHEDULED = 4;
  MARKET_STATUS_OPEN = 5;
  MARKET_STATUS_CLOSED = 6;
  MARKET_STATUS_PENDING = 7;       // 待結算 / 申訴期
  MARKET_STATUS_DISPUTED = 8;
  MARKET_STATUS_SETTLING = 9;
  MARKET_STATUS_SETTLED = 10;
  MARKET_STATUS_CANCELLED = 11;
}

// Page request / response 標準型別。
message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}

// AuditMeta 為所有寫操作 RPC 的標準附帶欄位，提供 Idempotency 與 trace。
message AuditMeta {
  string idempotency_key = 1;     // SPEC-002 §6.1
  string correlation_id = 2;
  string trace_id = 3;
  google.protobuf.Timestamp client_ts = 4;   // 客戶端時間，僅供 audit
}
