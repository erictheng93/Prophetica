name: nightly-mutants

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  mutants:
    # Use the default GitHub-hosted runner unless a larger runner is explicitly configured.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: install rdkafka deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake clang lld pkg-config
      - name: run mutants on core logic crates only
        # SPEC-017 §3.3 R-4: 限縮在 ledger + 撮合 hot path（避免 CRUD service 之低意義 mutant 拖慢 nightly 跑時）
        # 路徑對齊實際 src 結構：matching-engine 採 flat layout（order_book.rs / service.rs / shard.rs）；
        # wallet-ledger-service 與 sdk 採 ledger/ 子目錄。
        run: |
          cargo mutants \
            --in-place \
            --package wallet-ledger-service --package matching-engine --package sdk \
            --file 'services/wallet-ledger-service/src/ledger/**' \
            --file 'services/wallet-ledger-service/src/reconciliation.rs' \
            --file 'services/matching-engine/src/order_book.rs' \
            --file 'services/matching-engine/src/shard.rs' \
            --file 'services/matching-engine/src/sentinel.rs' \
            --file 'crates/sdk/src/ledger/**' \
            --minimum-test-timeout 60 \
            --json > mutants.json
      - name: enforce caught rate (T-7 staged threshold)
        # SPEC-017 v0.2.5 §3.3 R-4 / T-7: MVP 起步 60%，每季度 +5%，6 個月內達 75%。
        # 啟動門檻為 60；當前 quarter 過後 ops 應將此數字逐步調升至 65 / 70 / 75。
        run: ./tools/scripts/check-mutants.sh mutants.json 60
      - name: upload mutants artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutants
          path: mutants.json
          retention-days: 30
      - name: slack alert on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: eng-quality
          payload: '{"text":"nightly-mutants failed for SPEC-017 scope"}'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
