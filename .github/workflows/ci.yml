name: ci

# Lightweight, language-agnostic gates: standalone node scripts + landing
# variant manifests. Rust lives in rust.yml; the pnpm workspace in node.js.yml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  landing-variant-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: test landing variant validator
        run: node --test tools/scripts/validate-landing-variants.test.mjs
      - name: validate landing variant manifests
        run: node tools/scripts/validate-landing-variants.mjs

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: test repository scripts
        run: node --test tools/scripts/*.test.mjs

  proto-drift:
    # Regenerate the committed protobuf stubs from packages/proto/v1/*.proto and
    # fail if crates/proto/src/gen or packages/proto/gen/ts drift from source.
    # SDD requires generated artifacts never lag the .proto source; release.yml
    # enforces this at tag time, this brings the same gate to every PR.
    # buf.gen.yaml uses remote plugins, so no local protoc/plugin install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: regenerate protobuf stubs
        run: pnpm exec buf generate
      - name: fail on uncommitted protobuf drift
        run: git diff --exit-code crates/proto/src/gen packages/proto/gen/ts
