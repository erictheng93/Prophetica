name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  landing-variant-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: test landing variant validator
        run: node --test tools/scripts/validate-landing-variants.test.mjs
      - name: validate landing variant manifests
        run: node tools/scripts/validate-landing-variants.mjs

  rust-lsp-lint:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: install native rdkafka deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake clang lld pkg-config
      - name: rust syntax and type check
        run: cargo check --workspace --locked
      - name: rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rust format check
        run: cargo fmt --all -- --check
