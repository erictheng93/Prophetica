name: frontend

# Frontend CI for the pnpm 9 + Turborepo workspace. ci.yml covers the
# repo's standalone node scripts (landing-variant validator, tools tests);
# this workflow fills the gap it leaves — the apps/* and packages/*
# workspace via turbo (lint / typecheck / test).
#
# The repo-wide `pnpm format:check` is intentionally NOT a gate here: the repo
# carries large pre-existing prettier drift (~165 files across apps, packages
# and docs) accumulated while this workflow was disabled. Re-introducing it as
# a blocking step would either require a churn-heavy repo-wide reformat mid-dev
# or fight the proto-drift gate over buf-generated stubs. Track the reformat as
# dedicated cleanup; run `pnpm format` locally when ready.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  turbo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm version is sourced from `packageManager` in root package.json;
      # do not set `version:` here or it triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Persist Turborepo's local task cache (default .turbo dir) across runs so
      # unchanged lint/typecheck/test/build tasks replay from cache instead of
      # recomputing. A miss is harmless — turbo just recomputes and repopulates.
      - name: cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: lint (per-app tsc via tsconfig.lint.json)
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test (turbo; builds first per turbo.json dependsOn)
        run: pnpm test
