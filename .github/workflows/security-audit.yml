name: security-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

jobs:
  rust-security-audit:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true" # rustc-wrapper=sccache comes from .cargo/config.toml
      CARGO_INCREMENTAL: "0" # sccache cannot cache incremental units
    steps:
      - uses: actions/checkout@v6
      # Project toolchain single-sourced from rust-toolchain.toml (channel 1.85);
      # the extra 1.88 toolchain below is installed only for cargo-deny.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false # caching is handled explicitly below (Swatinem + sccache)
          # Suppress this action's default RUSTFLAGS=-D warnings so the geiger build
          # is not failed by incidental compiler warnings.
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: install cargo-geiger
        timeout-minutes: 20
        run: cargo install cargo-geiger --locked
      - uses: dtolnay/rust-toolchain@1.88
      - name: install cargo-deny
        timeout-minutes: 20
        run: cargo +1.88 install cargo-deny --version 0.19.4 --locked
      - name: cargo deny
        run: cargo +1.88 deny check
      - name: cargo geiger
        run: cargo +1.85 geiger --workspace --output-format Json > geiger.json
      - name: forbid unsafe regression
        run: ./tools/scripts/check-geiger.sh geiger.json
      - name: upload geiger artifact
        uses: actions/upload-artifact@v4
        with:
          name: geiger
          path: geiger.json
          retention-days: 30
