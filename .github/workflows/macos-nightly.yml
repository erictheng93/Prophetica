name: macos-nightly

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      # pnpm version is sourced from `packageManager` in root package.json.
      # Specifying `version:` here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: doctor
        run: make doctor
      - name: rust unit tests
        run: cargo test --workspace --locked
