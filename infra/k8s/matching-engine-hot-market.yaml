apiVersion: v1
kind: Namespace
metadata:
  name: prophetica-engine
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matching-engine-hot-config
  namespace: prophetica-engine
data:
  MATCHING_ENGINE_PORT: "8088"
  MATCHING_ENGINE_GRPC_PORT: "9088"
  MATCHING_ENGINE_KAFKA_BROKERS: "kafka-bootstrap.kafka.svc.cluster.local:9092"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine-hot
  namespace: prophetica-engine
  labels:
    app.kubernetes.io/name: matching-engine
    app.kubernetes.io/component: hot-market
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: matching-engine
      app.kubernetes.io/component: hot-market
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matching-engine
        app.kubernetes.io/component: hot-market
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8088"
    spec:
      nodeSelector:
        prophetica.com/node-pool: matching-engine-hot
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: matching-engine
              app.kubernetes.io/component: hot-market
      terminationGracePeriodSeconds: 30
      containers:
        - name: matching-engine-hot
          image: ghcr.io/prophetica/matching-engine-hot:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["matching-engine-hot"]
          envFrom:
            - configMapRef:
                name: matching-engine-hot-config
          ports:
            - name: http
              containerPort: 8088
            - name: grpc
              containerPort: 9088
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: "1000m"
              memory: 512Mi
            limits:
              cpu: "2000m"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: matching-engine-hot
  namespace: prophetica-engine
  labels:
    app.kubernetes.io/name: matching-engine
    app.kubernetes.io/component: hot-market
spec:
  selector:
    app.kubernetes.io/name: matching-engine
    app.kubernetes.io/component: hot-market
  ports:
    - name: http
      port: 8088
      targetPort: http
    - name: grpc
      port: 9088
      targetPort: grpc
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matching-engine-hot
  namespace: prophetica-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matching-engine-hot
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: matching-engine-hot
  namespace: prophetica-engine
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matching-engine
      app.kubernetes.io/component: hot-market
