groups:
  - name: prophetica-latency-budget
    interval: 30s
    rules:
      - alert: PropheticaOrderSubmitE2ELatencyBudgetP0
        expr: |
          histogram_quantile(0.99, sum(rate(proph_latency_budget_hop_seconds_bucket{span="api.order.submit.e2e"}[5m])) by (le, span)) > 0.060
        for: 2m
        labels:
          severity: P0
          spec: SPEC-007-6.4.4
          runbook: runbooks/latency-budget-breach.md
        annotations:
          summary: Order submit E2E P99 is above 2x the 30ms budget.
          description: SPEC-007 §6.4.4 requires P0 when latency budget usage is above 2x budget.

      - alert: PropheticaLatencyBudgetHopP1
        expr: |
          (
            histogram_quantile(0.99, sum(rate(proph_latency_budget_hop_seconds_bucket[5m])) by (le, span))
            > on (span)
            (1.5 * proph_latency_budget_hop_budget_seconds)
          )
        for: 5m
        labels:
          severity: P1
          spec: SPEC-007-6.4.4
          runbook: runbooks/latency-budget-breach.md
        annotations:
          summary: A latency budget hop is above 1.5x its P99 budget.
          description: Investigate the span owner before widening any latency budget.

      - alert: PropheticaLatencyBudgetHopP0
        expr: |
          (
            histogram_quantile(0.99, sum(rate(proph_latency_budget_hop_seconds_bucket[5m])) by (le, span))
            > on (span)
            (2 * proph_latency_budget_hop_budget_seconds)
          )
        for: 2m
        labels:
          severity: P0
          spec: SPEC-007-6.4.4
          runbook: runbooks/latency-budget-breach.md
        annotations:
          summary: A latency budget hop is above 2x its P99 budget.
          description: Freeze release promotion and follow the latency budget runbook.

  - name: prophetica-p0-alerts
    interval: 30s
    rules:
      - alert: PropheticaLedgerImbalance
        expr: increase(proph_ledger_txn_failed_total{reason="imbalance"}[1m]) > 0
        labels:
          severity: P0
          runbook: runbooks/ledger-imbalance.md
        annotations:
          summary: Ledger imbalance detected.

      - alert: PropheticaEngineP99Over50ms
        expr: histogram_quantile(0.99, sum(rate(proph_engine_match_latency_seconds_bucket[1m])) by (le)) > 0.050
        for: 1m
        labels:
          severity: P0
          runbook: runbooks/engine-p99-over-50ms.md
        annotations:
          summary: Matching engine P99 exceeded 50ms.

      - alert: PropheticaMatchingEngineOrderRouteP99Over30ms
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(proph_engine_http_request_duration_seconds_bucket{route="/api/v1/markets/:market_id/orders"}[5m])) by (le, route)
          ) > 0.030
        for: 5m
        labels:
          severity: P1
          spec: SPEC-003-11
          runbook: runbooks/engine-p99-over-50ms.md
        annotations:
          summary: Matching engine order route P99 exceeded the 30ms L1/L2 budget.
          description: Check hot-market skew, command queue depth, Kafka publish latency, and CPU saturation.

      - alert: PropheticaMatchingEngineCommandP99Over5ms
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(proph_engine_command_duration_seconds_bucket[5m])) by (le, command)
          ) > 0.005
        for: 5m
        labels:
          severity: P1
          spec: SPEC-003-11
          runbook: runbooks/engine-p99-over-50ms.md
        annotations:
          summary: Matching engine internal command P99 exceeded 5ms.
          description: Internal command latency is above the SPEC-003 matching hot-path budget.

      - alert: PropheticaMatchingEngineCommandQueueDepthHigh
        expr: max_over_time(proph_engine_command_queue_depth[5m]) > 512
        for: 5m
        labels:
          severity: P1
          spec: SPEC-003-11
          runbook: runbooks/engine-p99-over-50ms.md
        annotations:
          summary: Matching engine command queue depth is above the hot-market threshold.
          description: Sustained command queue depth indicates hot-market overload or blocked shard processing.

      - alert: PropheticaApi5xxHigh
        expr: |
          sum(rate(proph_http_requests_total{status=~"5.."}[2m]))
          /
          clamp_min(sum(rate(proph_http_requests_total[2m])), 1)
          > 0.05
        for: 2m
        labels:
          severity: P0
          runbook: runbooks/api-5xx-high.md
        annotations:
          summary: API 5xx rate exceeded 5%.
