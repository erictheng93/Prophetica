# SPEC-008 B-2: Tokyo same-region synchronous standby.
listen_addresses = '*'
hot_standby = on
primary_conninfo = 'host=tokyo-primary port=5432 user=replicator application_name=standby1 passfile=/var/lib/postgresql/.pgpass'
primary_slot_name = 'standby1'
promote_trigger_file = '/tmp/postgresql.promote'

wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
