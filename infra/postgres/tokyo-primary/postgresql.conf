# SPEC-008 B-2: Tokyo same-region synchronous primary.
listen_addresses = '*'
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on

synchronous_commit = on
synchronous_standby_names = 'standby1'

archive_mode = on
archive_timeout = 60s
archive_command = '/opt/prophetica/postgres/archive-wal-to-r2.sh "%p" "%f"'

log_replication_commands = on
