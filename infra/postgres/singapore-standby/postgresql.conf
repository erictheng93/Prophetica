# SPEC-008 B-6: Singapore cross-region async DR standby.
listen_addresses = '*'
hot_standby = on
primary_conninfo = 'host=tokyo-primary port=5432 user=replicator application_name=singapore-dr passfile=/var/lib/postgresql/.pgpass'
primary_slot_name = 'singapore_dr'

wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
